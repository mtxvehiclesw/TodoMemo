<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Diary · 나의 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="logo">O</div>
    <div>
      <h1>Orange Diary</h1>
      <p>나만의 캘린더 · 할 일 · 메모</p>
    </div>
  </header>

  <main class="layout">
    <section class="card calendar">
      <div class="cal-head">
        <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
        <div class="cal-title">
          <span id="year"></span>
          <h2 id="month"></h2>
        </div>
        <button class="icon-btn" id="next" aria-label="다음 달">›</button>
        <button class="ghost" id="today">오늘</button>
      </div>
      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i class="dot d-todo"></i>할 일</span>
        <span><i class="dot d-memo"></i>메모</span>
      </div>
    </section>

    <section class="card side">
      <div class="side-head">
        <div>
          <div class="side-date" id="sideDate"></div>
          <div class="side-sub" id="sideSub"></div>
        </div>
        <div class="ring" id="ring"><span id="ringText">0%</span></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="todo">할 일</button>
        <button class="tab" data-tab="memo">메모장</button>
      </div>

      <div class="panel" id="panel-todo">
        <form class="add" id="todoForm">
          <input id="todoInput" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="120">
          <button class="primary" type="submit">추가</button>
        </form>
        <ul class="list" id="todoList"></ul>
        <div class="empty" id="todoEmpty">이 날의 할 일이 없어요.<br>여유로운 하루를 즐기세요 ✦</div>
      </div>

      <div class="panel hidden" id="panel-memo">
        <form class="memo-form" id="memoForm">
          <input id="memoTitle" placeholder="제목 (선택)" maxlength="60" autocomplete="off">
          <textarea id="memoBody" rows="4" placeholder="메모를 남겨보세요…"></textarea>
          <div class="row">
            <button class="ghost hidden" type="button" id="memoCancel">취소</button>
            <button class="primary" type="submit" id="memoSave">저장</button>
          </div>
        </form>
        <ul class="memos" id="memoList"></ul>
        <div class="empty" id="memoEmpty">아직 메모가 없어요.<br>떠오르는 생각을 적어보세요 ✦</div>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
